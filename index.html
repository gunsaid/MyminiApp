<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloader Media</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        h2 { color: #333; }
        input { width: 90%; max-width: 400px; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        button { background: #0088cc; color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        #result { margin-top: 25px; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); min-height: 50px; }
    <script>
        async function downloadMedia() {
            const url = document.getElementById('urlInput').value;
            const resultDiv = document.getElementById('result');
            const apiKey = '9864a5fcf1msh7871db2a38146c3p186191jsn2127ee9a8c3a'; 

            if (!url) {
                alert("Masukin link dulu, bro!");
                return;
            }

            resultDiv.innerText = "Lagi nyari videonya... bentar ya!";

            try {
                // Kita ganti endpoint ke yang lebih stabil
                const response = await fetch("https://tiktok-downloader-api.p.rapidapi.com/v1/feed/?url=" + encodeURIComponent(url), {
                    "method": "GET",
                    "headers": {
                        "x-rapidapi-key": apiKey,
                        "x-rapidapi-host": "tiktok-downloader-api.p.rapidapi.com"
                    }
                });

                const data = await response.json();

                if (data.status === "success") {
                    resultDiv.innerHTML = `
                        <p>Video ketemu!</p>
                        <a href="${data.result.video_url}" target="_blank" style="padding: 12px 20px; background: #28a745; color: white; border-radius: 8px; text-decoration: none;">Download Sekarang</a>
                    `;
                } else {
                    // Kalau gagal, kita kasih link otomatis ke SnapTik biar user lu tetep bisa download
                    resultDiv.innerHTML = `
                        <p>API lagi sibuk. Jangan khawatir, klik tombol ini buat download:</p>
                        <a href="https://snaptik.app/en?url=${encodeURIComponent(url)}" target="_blank" style="padding: 12px 20px; background: #ff5722; color: white; border-radius: 8px; text-decoration: none;">Download via SnapTik</a>
                    `;
                }
            } catch (error) {
                resultDiv.innerText = "Error: " + error.message;
            }
        }
    </script>
