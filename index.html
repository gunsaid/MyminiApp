<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloader Media</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        h2 { color: #333; }
        input { width: 90%; max-width: 400px; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        button { background: #0088cc; color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        #result { margin-top: 25px; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); min-height: 50px; }
    </style>
</head>
<body>

    <h2>Downloader Media</h2>
    <p>Tempel link TikTok di bawah:</p>
    <input type="text" id="urlInput" placeholder="https://vt.tiktok.com/...">
    <br>
    <button onclick="downloadMedia()">Download</button>
    <div id="result">Hasil akan muncul di sini...</div>

    <script>
        async function downloadMedia() {
            const url = document.getElementById('urlInput').value;
            const resultDiv = document.getElementById('result');
            const apiKey = '9864a5fcf1msh7871db2a38146c3p186191jsn2127ee9a8c3a'; 

            if (!url) {
                alert("Masukin link dulu, bro!");
                return;
            }

            resultDiv.innerText = "Lagi proses... tunggu bentar ya!";

            try {
                const response = await fetch("https://social-media-video-downloader.p.rapidapi.com/v3/video/details?url=" + encodeURIComponent(url), {
                    "method": "GET",
                    "headers": {
                        "x-rapidapi-key": apiKey,
                        "x-rapidapi-host": "social-media-video-downloader.p.rapidapi.com"
                    }
                });

                const data = await response.json();

                if (data && data.video_url) {
                    resultDiv.innerHTML = `
                        <p>Video ketemu!</p>
                        <a href="${data.video_url}" download="video-tiktok.mp4" style="display:inline-block; padding: 12px 20px; background: #28a745; color: white; border-radius: 8px; text-decoration: none; font-weight: bold;">Download Sekarang</a>
                    `;
                } else {
                    resultDiv.innerText = "Gagal. Pastikan link-nya bener dan dari TikTok ya.";
                }
            } catch (error) {
                resultDiv.innerText = "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
