<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloader Media</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #0088cc; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        #result { margin-top: 20px; padding: 10px; background: white; border-radius: 5px; min-height: 50px; }
<script>
    async function downloadMedia() {
        const url = document.getElementById('urlInput').value;
        const resultDiv = document.getElementById('result');
        const apiKey = '9864a5fcf1msh7871db2a38146c3p186191jsn2127ee9a8c3a'; 

        if (!url) {
            alert("Masukin link dulu, bro!");
            return;
        }

        resultDiv.innerText = "Lagi proses download...";

        try {
            const response = await fetch("https://social-media-video-downloader.p.rapidapi.com/v3/video/details?url=" + encodeURIComponent(url), {
                "method": "GET",
                "headers": {
                    "x-rapidapi-key": apiKey,
                    "x-rapidapi-host": "social-media-video-downloader.p.rapidapi.com"
                }
            });

            const data = await response.json();

            if (data && data.video_url) {
                // Tampilkan tombol download dengan atribut 'download'
                resultDiv.innerHTML = `
                    <p>Video siap!</p>
                    <a href="${data.video_url}" download="video-tiktok.mp4" style="padding: 12px 20px; background: #e91e63; color: white; border-radius: 8px; text-decoration: none; font-weight: bold;">Download Sekarang</a>
                `;
            } else {
                resultDiv.innerText = "Maaf, link video tidak ditemukan.";
            }
        } catch (error) {
            resultDiv.innerText = "Error: " + error.message;
        }
    }
</script>
