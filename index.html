 <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloader Media</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #0088cc; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        #result { margin-top: 20px; padding: 10px; background: white; border-radius: 5px; min-height: 50px; }
    </style>
</head>
<body>

    <h2>Downloader Media</h2>
    <p>Tempel link TikTok di bawah:</p>
    <input type="text" id="urlInput" placeholder="https://vt.tiktok.com/...">
    <br>
    <button onclick="downloadMedia()">Download</button>
    <div id="result">Hasil akan muncul di sini...</div>

    <script>
        async function downloadMedia() {
            const url = document.getElementById('urlInput').value;
            const resultDiv = document.getElementById('result');
            // API Key yang sudah diperbaiki
            const apiKey = '9864a5fcf1msh7871db2a38146c3p186191jsn2127ee9a8c3a'; 

            if (!url) {
                alert("Masukin link dulu, bro!");
                return;
            }

            resultDiv.innerText = "Lagi nyari videonya... bentar ya!";

            try {
                const response = await fetch("https://tiktok-downloader-api.p.rapidapi.com/v1/feed/?url=" + encodeURIComponent(url), {
                    "method": "GET",
                    "headers": {
                        "x-rapidapi-key": apiKey,
                        "x-rapidapi-host": "tiktok-downloader-api.p.rapidapi.com"
                    }
                });

                const data = await response.json();

                if (data.status === "success") {
                    resultDiv.innerHTML = `
                        <p>Video ketemu!</p>
                        <a href="${data.result.video_url}" target="_blank" style="padding: 10px; background: green; color: white; border-radius: 5px; text-decoration: none;">Download Sekarang</a>
                    `;
                } else {
                    resultDiv.innerText = "Gagal ambil video. Pastikan link-nya bener.";
                }
            } catch (error) {
                resultDiv.innerText = "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
