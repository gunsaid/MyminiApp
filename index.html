<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloader Media</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #0088cc; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        #result { margin-top: 20px; padding: 10px; background: white; border-radius: 5px; min-height: 50px; }
    </style>
</head>
<body>

    <h2>Downloader Media</h2>
    <p>Tempel link TikTok di bawah:</p>
    <input type="text" id="urlInput" placeholder="https://vt.tiktok.com/...">
    <br>
    <button onclick="downloadMedia()">Download</button>
    <div id="result">Hasil akan muncul di sini...</div>

    <script>
        async function downloadMedia() {
            const url = document.getElementById('urlInput').value;
            const resultDiv = document.getElementById('result');
            const apiKey = '9864a5fcf1msh7871db2a38146c3p186191jsn2127ee9a8c3a'; 

            if (!url) {
                alert("Masukin link dulu, bro!");
                return;
            }

            resultDiv.innerText = "Lagi proses link-nya... sabar ya!";

            try {
                // Kita kirim ke API. API yang bagus biasanya otomatis 'unshorten' link pendek sendiri.
                const response = await fetch("https://social-media-video-downloader.p.rapidapi.com/v3/video/details?url=" + encodeURIComponent(url), {
                    "method": "GET",
                    "headers": {
                        "x-rapidapi-key": apiKey,
                        "x-rapidapi-host": "social-media-video-downloader.p.rapidapi.com"
                    }
                });

                const data = await response.json();

                // Kita periksa respon dari API
                if (data && data.video_url) {
                    resultDiv.innerHTML = `
                        <p>Video berhasil diproses!</p>
                        <a href="${data.video_url}" target="_blank" style="display:inline-block; padding: 12px 20px; background: #28a745; color: white; border-radius: 8px; text-decoration: none; font-weight: bold;">Download Sekarang</a>
                    `;
                } else {
                    // Kalau gagal, kasih solusi ke user
                    resultDiv.innerHTML = "Gagal. Coba klik link di bawah ini:<br><br>" + 
                    `<a href="https://snaptik.app/en?url=${encodeURIComponent(url)}" target="_blank" style="color:blue;">Klik di sini buat download via SnapTik</a>`;
                }
            } catch (error) {
                resultDiv.innerText = "Error: " + error.message;
            }
        }
    </script>
