<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloader Media</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #0088cc; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        #result { margin-top: 20px; padding: 10px; background: white; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Downloader Media</h2>
    <p>Tempel link (TikTok/IG/YT) di bawah:</p>
    <input type="text" id="urlInput" placeholder="https://...">
    <br>
    <button onclick="downloadMedia()">Download</button>
    
    <div id="result">Hasil akan muncul di sini...</div>

    <script>
    async function downloadMedia() {
        const url = document.getElementById('urlInput').value;
        const resultDiv = document.getElementById('result');
        
        if (!url) {
            alert("Masukin link dulu, bro!");
            return;
        }

        resultDiv.innerText = "Lagi proses... tunggu sebentar ya!";

        try {
            // Kita pakai API downloader gratisan
            const apiUrl = `https://api.allorigins.win/get?url=${encodeURIComponent('https://api.tikdown.org/api/download?url=' + url)}`;
            
            // Contoh sederhana: Arahkan user ke link downloader (ini cara paling aman tanpa ribet API Key)
            window.open('https://snaptik.app/en?url=' + encodeURIComponent(url), '_blank');
            
            resultDiv.innerText = "Sip, link sudah dibuka di tab baru!";
        } catch (error) {
            resultDiv.innerText = "Yah, gagal nih. Coba lagi nanti ya.";
        }
    }
</script>
